<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!--
  mBlock tezgahi.

  Sayfa uygulamanin KENDI paketinden geliyor; disariya hicbir istek yok.
  Icerik Guvenligi Politikasi bunu ayrica kilitliyor: uzaktan betik,
  yazi tipi, resim ya da baglanti CEKILEMEZ. Kaynaklarin tamami
  assets/mblock/ altinda.
-->
<title>mBlock tezgahi</title>
<!--
  ICERIK GUVENLIGI POLITIKASI — SEMA TABANLI, `'self'` DEGIL.
  ONCEDEN `default-src 'none'; script-src 'self'` yaziyordu ve sayfa
  iOS'ta BOS aciliyordu. Sebep: `loadFlutterAsset` sayfayi `file://`
  uzerinden yukluyor; WKWebView'da bir file: belgesinin kaynagi
  opak (null) sayildigi icin `'self'` hicbir seye uymuyor ve kendi
  betiklerimiz bile engelleniyor. Sayfadan tek bir mesaj bile
  gelmiyordu, cunku betikler hic calismamisti.
  Semalari acikca yazmak ayni korumayi veriyor: politikanin hicbir
  yerinde http/https yok, yani uzaktan bir sey CEKILEMEZ; ustune
  connect-src 'none' butun ag isteklerini kapatiyor.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: #F9F9F9; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #tezgah { position: absolute; inset: 0; }

  /* ARAC KUTUSU ILE CALISMA ALANINI AYIRMA
     --------------------------------------
     scratch-blocks arac kutusunun arkasini YARI SAYDAM bir sekil
     olarak ciziyor; ortada ne oldugu belirsiz, puslu bir serit
     kaliyordu. Cocuk icin iki bolge tek bir bulanik alan gibi
     goruluyordu. Arka plan tam opak yapildi ve sag kenarina ince bir
     cizgi konuldu (#ayirac): solda BLOK LISTESI, saginda CALISMA
     ALANI. */
  .blocklyFlyoutBackground {
    fill: #FFFFFF !important;
    fill-opacity: 1 !important;
  }

  /* Arac kutusunun kendi kaydirma cubugu da yari saydam bir serit
     olarak ayni yere biniyordu. Liste zaten parmakla kayiyor. */
  .blocklyFlyout .blocklyScrollbarHandle,
  .blocklyFlyout .blocklyScrollbarBackground,
  .blocklyFlyoutScrollbar {
    display: none !important;
  }

  /* Iki bolge birbirinden RENKLE de ayrilsin: arac kutusu beyaz,
     calisma alani bir tik gri. Tek basina cizgi de yeterdi ama
     cocugun "nereye birakacagim" sorusu boylece bakar bakmaz
     cevaplaniyor. */
  .blocklySvg { background: #F1F3F5 !important; }

  #ayirac {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #DFE3E8;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
<div id="tezgah"></div>
<div id="ayirac"></div>
<script src="scratch_blocks.min.js"></script>
<script src="mblock_bloklari.js"></script>
<script src="tezgah.js"></script>
</body>
</html>
