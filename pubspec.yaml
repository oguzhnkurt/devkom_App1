name: devkom_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.16+25

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Environment variables
  flutter_dotenv: ^5.2.1

  # File handling
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Video player
  video_player: ^2.9.2
  youtube_player_flutter: ^9.0.3

  # Fonts & UI
  google_fonts: ^8.0.0
  provider: ^6.1.5+1

  # Chess game
  chess: ^0.7.0
  flutter_chess_board: ^1.0.1
  stockfish_chess_engine: ^0.8.2

  # Flame 2D game engine
  flame: ^1.20.0

  # Additional utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  confetti: ^0.7.0
  url_launcher: ^6.3.1
  # Play'deki yeni surumu ogrenmek icin (bkz. GuncellemeServisi).
  in_app_update: ^4.2.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  connectivity_plus: ^6.0.5
  carousel_slider: ^5.0.0
  # webview_flutter'i Dart tarafinda KIMSE import etmiyor (tek
  # kullanicisi olan Daily Maze ekrani silindi) ama ILAN EDILMIS KALMALI:
  # google_mobile_ads hem CocoaPods hem SPM tarafinda bu pakete bagli.
  # Kaldirildiginda `pod install` su hatayla duruyor:
  #   Unable to find a specification for `webview_flutter_wkwebview`
  #   depended upon by `google_mobile_ads`
  # Gomulu bir web sayfasi yeniden acilacaksa
  # test/embedded_webview_safety_test.dart'taki gezinme kurallarina uyulmali.
  webview_flutter: ^4.10.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  audioplayers: ^5.2.1
  sign_in_with_apple: ^6.1.2
  # Apple ile giriste nonce'un SHA-256 ozetini almak icin.
  crypto: ^3.0.6
  adapty_flutter: ^3.3.0

  # Reklam (AdMob). Kitlede cocuk oldugu icin istekler her zaman
  # kisisellestirmesiz gidiyor; bkz. lib/services/ads_service.dart.
  #
  # SURUM 8 ALTINA DUSURULMEMELI. Bu proje Flutter 3.44 ile Swift
  # Package Manager acik calisiyor. webview_flutter_wkwebview'in SPM
  # destegi var, bu yuzden Flutter onu CocoaPods'a HIC yazmiyor;
  # google_mobile_ads 5.x'in podspec'i ise ayni pod'u sürümsüz istiyor
  # ve `pod install` "Unable to find a specification for
  # webview_flutter_wkwebview" diyerek duruyor. 8.0.0 kendi
  # Package.swift'iyle geldigi icin bagimliligi SPM uzerinden
  # cozuyor ve sorun ortadan kalkiyor.
  google_mobile_ads: ^8.0.0

  # Meta (Facebook) uygulama olaylari. TEK AMACI: Meta'daki uygulama
  # yukleme reklamlarinin iOS 14.5+ cihazlarda olculebilmesi (Toplu
  # Olay Olcumu / SKAdNetwork). Meta, SDK'si olmayan bir uygulamaya
  # "iOS 14+ kampanyasi" actirmiyor; o kampanya olmadan reklam yalniz
  # iOS 13.7 ve oncesine gidiyor, yani pratikte hic kimseye.
  #
  # Reklam kimligi (IDFA) TOPLANMIYOR, ATT izni ISTENMIYOR: ayarlar
  # lib/services/meta_install_service.dart ve ios/Runner/Info.plist.
  # Karar ve gerekce: uygulama 13+ / veli odakli konumlandi (4 Ekim
  # 2026), bkz. docs/META_SDK_KURULUMU.md.
  facebook_app_events: ^0.30.5

  # Sertifika: kaydet / paylas (lib/courses/tanitim/sertifika_paylasimi.dart).
  # Hepsi ebeveyn kapisinin arkasinda.
  #  * share_plus: paylasim menusu (PNG ve PDF dosyasi).
  #  * pdf: A4 yatay sertifika PDF'i (saf Dart, yerel kod yok).
  #  * gal: galeriye kaydetme (iOS NSPhotoLibraryAddUsageDescription,
  #    Android <= 10 icin WRITE_EXTERNAL_STORAGE maxSdkVersion=29).
  share_plus: ^10.1.4
  pdf: ^3.13.1
  gal: ^2.3.3

  # Backend & Database
  http: ^1.2.1
  supabase_flutter: ^2.10.3
  get_it: ^9.1.0
  google_sign_in: ^7.2.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  # .mblock dosyalari birer zip: test/mblock_proje_test.dart proje
  # dosyasini acip ders metnindeki sayilarla karsilastiriyor. Yalnizca
  # test icin; uygulama paketine girmiyor.
  archive: ^4.0.0

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#5A34E8"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/fonts/Baloo2-OFL.txt
    - assets/images/games/
    - assets/images/ui/
    - assets/videos/
    - assets/sounds/
    - assets/sounds/ton/
    - assets/html/
    # MASKOT — buradan silinmesin.
    # 1.0.8 (build 13) bu satir olmadan derlendi ve YUKLENDI: Devi'nin
    # gorselleri pakete girmedi, uygulamada maskotun yerinde
    # `Icons.smart_toy_rounded` yedek simgesi cikiyordu. Kilit:
    # test/asset_bildirimi_test.dart
    - assets/maskot/
    # mBLOCK BLOK EDITORU — scratch-blocks paketi.
    #
    # mBlock'un kendi blok motoru (Apache-2.0). npm'deki `scratch-blocks`
    # 2.1.20 bir ES modulu olarak geliyor; tarayicida <script> ile
    # calissin diye esbuild ile tek bir IIFE dosyasina paketlendi.
    # Nasil uretildigi: assets/mblock/NASIL_URETILDI.md
    #
    # Klasor WebView'a `loadFlutterAsset` ile yerelden veriliyor; hicbir
    # CDN'e cikilmiyor, cocugun cihazinda internet gerekmiyor.
    - assets/mblock/
    - assets/mblock/media/

  # Yazi tipi uygulamayla birlikte geliyor. Daha once `google_fonts` paketi
  # dosyalari calisma aninda internetten cekiyordu; indirme bitene kadar
  # (ve internet yokken hep) Flutter Roboto'ya dusuyor, basliklar ince
  # goruluyordu.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    # Acilis ekranindaki "DevEducation" yazisi (OFL, assets/fonts/Baloo2-OFL.txt).
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
