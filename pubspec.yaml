name: devkom_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.8+14

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Environment variables
  flutter_dotenv: ^5.2.1

  # File handling
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Video player
  video_player: ^2.9.2
  youtube_player_flutter: ^9.0.3

  # Fonts & UI
  google_fonts: ^8.0.0
  provider: ^6.1.5+1

  # Chess game
  chess: ^0.7.0
  flutter_chess_board: ^1.0.1
  stockfish_chess_engine: ^0.8.2

  # Flame 2D game engine
  flame: ^1.20.0

  # Additional utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  confetti: ^0.7.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  connectivity_plus: ^6.0.5
  carousel_slider: ^5.0.0
  # webview_flutter'i Dart tarafinda KIMSE import etmiyor (tek
  # kullanicisi olan Daily Maze ekrani silindi) ama ILAN EDILMIS KALMALI:
  # google_mobile_ads hem CocoaPods hem SPM tarafinda bu pakete bagli.
  # Kaldirildiginda `pod install` su hatayla duruyor:
  #   Unable to find a specification for `webview_flutter_wkwebview`
  #   depended upon by `google_mobile_ads`
  # Gomulu bir web sayfasi yeniden acilacaksa
  # test/embedded_webview_safety_test.dart'taki gezinme kurallarina uyulmali.
  webview_flutter: ^4.10.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  sign_in_with_apple: ^6.1.2
  # Apple ile giriste nonce'un SHA-256 ozetini almak icin.
  crypto: ^3.0.6
  adapty_flutter: ^3.3.0

  # Reklam (AdMob). Kitlede cocuk oldugu icin istekler her zaman
  # kisisellestirmesiz gidiyor; bkz. lib/services/ads_service.dart.
  #
  # SURUM 8 ALTINA DUSURULMEMELI. Bu proje Flutter 3.44 ile Swift
  # Package Manager acik calisiyor. webview_flutter_wkwebview'in SPM
  # destegi var, bu yuzden Flutter onu CocoaPods'a HIC yazmiyor;
  # google_mobile_ads 5.x'in podspec'i ise ayni pod'u sürümsüz istiyor
  # ve `pod install` "Unable to find a specification for
  # webview_flutter_wkwebview" diyerek duruyor. 8.0.0 kendi
  # Package.swift'iyle geldigi icin bagimliligi SPM uzerinden
  # cozuyor ve sorun ortadan kalkiyor.
  google_mobile_ads: ^8.0.0

  # Sertifika paylasimi (PNG olarak kaydedip paylasiyoruz; ayri bir PDF
  # paketi eklemeye gerek yok, telefonlarda PNG paylasimi daha kolay).
  share_plus: ^10.1.4

  # Backend & Database
  http: ^1.2.1
  supabase_flutter: ^2.10.3
  get_it: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#5A34E8"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/games/
    - assets/videos/
    - assets/sounds/
    - assets/html/
    # MASKOT — buradan silinmesin.
    # 1.0.8 (build 13) bu satir olmadan derlendi ve YUKLENDI: Devi'nin
    # gorselleri pakete girmedi, uygulamada maskotun yerinde
    # `Icons.smart_toy_rounded` yedek simgesi cikiyordu. Kilit:
    # test/asset_bildirimi_test.dart
    - assets/maskot/

  # Yazi tipi uygulamayla birlikte geliyor. Daha once `google_fonts` paketi
  # dosyalari calisma aninda internetten cekiyordu; indirme bitene kadar
  # (ve internet yokken hep) Flutter Roboto'ya dusuyor, basliklar ince
  # goruluyordu.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
